{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="glass-card p-5 mx-auto text-center" style="max-width: 720px;">
    <div class="badge text-bg-warning-subtle text-warning-emphasis mb-3">Lost in the civic gallery</div>
    <div class="display-1 fw-bold mb-3" style="letter-spacing: -0.08em;">404</div>
    <h1 class="section-title mb-3">We couldn’t find that page</h1>
    <p class="text-muted mb-4">The content may have moved, the link may be broken, or the civic story is still being created.</p>
    <div class="flag-bar mx-auto mb-4" style="max-width: 360px;"></div>
    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <a href="{{ url_for('main.home') }}" class="btn btn-primary">Return Home</a>
      <a href="{{ url_for('main.gallery') }}" class="btn btn-outline-primary">Browse artwork</a>
    </div>
  </div>
</section>
{% endblock %}
